[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tablerag"
version = "0.1.0"
description = "LedgerRAG - self-hosted multilingual document RAG platform with high-accuracy table parsing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    # The SERVER is pinned to v1.12.4 in docker-compose while this floated
    # free, so a rebuild pulled client 1.19 and the library itself declared
    # the pair incompatible ("minor version difference must not exceed 1").
    # Bound it to the server it talks to: pinning one end and not the other
    # is how a rebuild silently changes what retrieval does.
    "qdrant-client>=1.12,<1.14",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff==0.15.20",
]
# MCP server (tablerag.mcp.server): exposes KBs to Claude Desktop / Cursor /
# Claude Code. Runs on the machine with the MCP client, wraps the HTTP API —
# so it is not needed by the API/worker deployment. httpx is already a core dep.
mcp = [
    "mcp>=1.2",
]

[project.scripts]
ledgerrag-mcp = "tablerag.mcp.server:main"

[tool.setuptools.packages.find]
include = ["tablerag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The docs guards import `tests.unit.docs_guard_lib`, and there is no
# tests/__init__.py to make that a package on its own. `python -m pytest`
# happens to work because -m puts the CWD on sys.path; bare `pytest` — what
# CI runs — does not, so the guards were green here and red on the runner.
# Say it explicitly instead of depending on how pytest was launched.
pythonpath = ["."]
markers = [
    "integration: requires the full docker-compose stack (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
